<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>

    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#0f172a;
        font-family:Arial;
        color:white;
    }

    .box{
        width:350px;
        padding:25px;
        background:#111827;
        border-radius:12px;
        text-align:center;
        animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
        from{opacity:0; transform:translateY(20px);}
        to{opacity:1; transform:translateY(0);}
    }

    input{
        width:100%;
        padding:12px;
        margin:8px 0;
        border:none;
        border-radius:8px;
        outline:none;
    }

    button{
        width:100%;
        padding:12px;
        background:#f97316;
        border:none;
        border-radius:8px;
        color:white;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:#ea580c;
    }

    .msg{
        margin-top:10px;
        font-size:14px;
        color:#38bdf8;
    }

    </style>
</head>

<body>

<div class="box">

    <h2>🔁 Forgot Password</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="new_password" placeholder="New Password" required>

        <button type="submit">Reset Password</button>

    </form>

    {% if message %}
        <div class="msg">{{ message }}</div>
    {% endif %}

</div>

</body>
</html>
