<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Church Portal</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* CARD */
.login-box {
    background: #111827;
    padding: 40px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    animation: fadeIn 0.6s ease;
}

/* TITLE */
.login-box h2 {
    text-align: center;
    margin-bottom: 25px;
}

/* INPUTS */
.login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 6px;
    outline: none;
}

/* BUTTON */
.login-box button {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.login-box button:hover {
    background: #1d4ed8;
}

/* ERROR */
.error {
    color: #f87171;
    text-align: center;
    margin-top: 10px;
}

/* LINK */
.forgot {
    text-align: right;
    font-size: 12px;
    margin-top: 5px;
}

.forgot a {
    color: #93c5fd;
    text-decoration: none;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div class="login-box">

    <h2>⛪ Church Portal Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <div class="forgot">
            <a href="/forgot-password">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</div>

</body>
</html>
