<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            font-family:Arial;
        }

        .box{
            width:360px;
            padding:30px;
            background:white;
            border-radius:14px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
            animation:fadeIn .4s ease;
            text-align:center;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(15px);}
            to{opacity:1; transform:translateY(0);}
        }

        h2{
            margin-bottom:10px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:1px solid #ddd;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            background:#22c55e;
            border:none;
            color:white;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#16a34a;
        }

        .msg{
            margin-top:10px;
            font-size:13px;
            color:red;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Reset Password</h2>

    <form method="POST">

        <input type="password" name="password" placeholder="New Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Update Password</button>

    </form>

    {% if message %}
    <div class="msg">{{ message }}</div>
    {% endif %}

</div>

</body>
</html>
