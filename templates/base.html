<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Portal</title>

<style>

/* =========================
   GLOBAL
========================= */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    transition: 0.3s;
}

/* =========================
   DARK MODE
========================= */
body.light {
    background: #f1f5f9;
    color: #111;
}

/* =========================
   SIDEBAR
========================= */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 220px;
    background: #111827;
    transition: 0.3s ease;
    overflow: hidden;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
}

.sidebar.collapsed {
    width: 70px;
}

/* HEADER */
.sidebar-header {
    padding: 15px;
    text-align: center;
    font-weight: bold;
    border-bottom: 1px solid #1f2937;
}

/* TOGGLE */
.toggle-btn {
    padding: 12px;
    cursor: pointer;
    background: #1f2937;
    text-align: center;
    transition: 0.3s;
}

.toggle-btn:hover {
    background: #374151;
}

/* MENU */
.sidebar a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px;
    color: white;
    text-decoration: none;
    transition: 0.3s;
    white-space: nowrap;
    position: relative;
}

.sidebar a:hover {
    background: #1f2937;
}

/* ICON */
.icon {
    font-size: 18px;
    width: 30px;
    text-align: center;
}

/* TEXT */
.text {
    transition: 0.3s;
}

/* COLLAPSE TEXT */
.sidebar.collapsed a .text {
    display: none;
}

.sidebar.collapsed a {
    justify-content: center;
}

/* TOOLTIP */
.sidebar.collapsed a:hover::after {
    content: attr(data-title);
    position: absolute;
    left: 75px;
    background: #1f2937;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    font-size: 12px;
}

/* =========================
   MAIN
========================= */
.main {
    margin-left: 220px;
    padding: 20px;
    transition: 0.3s ease;
}

.sidebar.collapsed ~ .main {
    margin-left: 70px;
}

/* =========================
   COUNTER ANIMATION
========================= */
.counter {
    font-size: 30px;
    font-weight: bold;
    animation: countUp 1s ease;
}

@keyframes countUp {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* =========================
   ACTIVE LINK
========================= */
.sidebar a.active {
    background: #2563eb;
}

/* =========================
   DARK MODE BUTTON
========================= */
.dark-toggle {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    cursor: pointer;
    padding: 10px;
    background: #1f2937;
}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">

    <div class="toggle-btn" onclick="toggleSidebar()">☰</div>

    <div class="sidebar-header">
        ⛪ Portal
    </div>

    <!-- ORDER FIXED BELOW ONLY -->

    <a href="/dashboard" data-title="Dashboard">
        <span class="icon">🏠</span>
        <span class="text">Dashboard</span>
    </a>

    <a href="/finance" data-title="Finance">
        <span class="icon">💰</span>
        <span class="text">Finance</span>
    </a>

    <a href="/attendance" data-title="Attendance">
        <span class="icon">📋</span>
        <span class="text">Attendance</span>
    </a>

    <a href="/pdf" data-title="PDF Reports">
        <span class="icon">📄</span>
        <span class="text">PDF</span>
    </a>

    <a href="/logout" data-title="Logout">
        <span class="icon">🚪</span>
        <span class="text">Logout</span>
    </a>

    <a href="/change-password" data-title="Change Password">
        <span class="icon">🔐</span>
        <span class="text">Change Password</span>
    </a>

    <div class="dark-toggle" onclick="toggleDarkMode()">
        🌙
    </div>

</div>

<!-- ================= MAIN ================= -->
<div class="main">

    {% block content %}
    {% endblock %}

</div>

<!-- ================= SCRIPT ================= -->
<script>

/* SIDEBAR TOGGLE */
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}

/* DARK MODE */
function toggleDarkMode() {
    document.body.classList.toggle("light");
}

/* ACTIVE LINK */
const links = document.querySelectorAll(".sidebar a");
links.forEach(link => {
    link.addEventListener("click", function() {
        links.forEach(l => l.classList.remove("active"));
        this.classList.add("active");
    });
});

</script>

</body>
</html>
