<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            font-family:Arial;
            color:white;
        }

        .box{
            width:360px;
            padding:30px;
            background:#111827;
            border-radius:14px;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
            animation:fadeIn .5s ease;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(20px);}
            to{opacity:1; transform:translateY(0);}
        }

        h2{
            text-align:center;
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            background:#f97316;
            border:none;
            border-radius:8px;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#ea580c;
        }

        .msg{
            text-align:center;
            margin-top:10px;
            font-size:13px;
            color:#93c5fd;
        }

        .back{
            text-align:center;
            margin-top:10px;
            font-size:12px;
        }

        .back a{
            color:#60a5fa;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Forgot Password</h2>

    <form method="POST">

        <input type="email" name="email" placeholder="Enter your email" required>

        <button type="submit">Send Reset Link</button>

    </form>

    {% if message %}
    <div class="msg">{{ message }}</div>
    {% endif %}

    <div class="back">
        <a href="/">← Back to Login</a>
    </div>

</div>

</body>
</html>
