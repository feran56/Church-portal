<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Portal</title>

<style>

/* =========================
   GLOBAL
========================= */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    transition: 0.3s;
}

body.light {
    background: #f1f5f9;
    color: #111;
}

/* =========================
   SIDEBAR
========================= */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 220px;
    background: #111827;
    transition: 0.3s ease;
    overflow: hidden;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
}

.sidebar.collapsed {
    width: 70px;
}

.sidebar-header {
    padding: 15px;
    text-align: center;
    font-weight: bold;
    border-bottom: 1px solid #1f2937;
}

.toggle-btn {
    padding: 12px;
    cursor: pointer;
    background: #1f2937;
    text-align: center;
    transition: 0.3s;
}

.toggle-btn:hover {
    background: #374151;
}

.sidebar a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    color: white;
    text-decoration: none;
    transition: all 0.25s ease;
    white-space: nowrap;
    position: relative;
    border-left: 3px solid transparent;
}

.sidebar a:hover {
    background: #1f2937;
    border-left: 3px solid #2563eb;
}

.icon {
    font-size: 18px;
    width: 30px;
    text-align: center;
}

.text {
    transition: 0.3s;
}

.sidebar.collapsed a .text {
    display: none;
}

.sidebar.collapsed a {
    justify-content: center;
}

.sidebar a.active {
    background: #2563eb;
    border-left: 3px solid #60a5fa;
}

/* =========================
   MAIN
========================= */
.main {
    margin-left: 220px;
    padding: 20px;
    transition: 0.3s ease;
}

.sidebar.collapsed ~ .main {
    margin-left: 70px;
}

/* =========================
   DARK MODE
========================= */
.dark-toggle {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    cursor: pointer;
    padding: 12px;
    background: #1f2937;
    transition: 0.3s;
}

.dark-toggle:hover {
    background: #374151;
}

/* =========================
   CALCULATOR (NEW PREMIUM UI)
========================= */
#calcModal {
    display: none;
    position: fixed;
    z-index: 9999;
    background: transparent;
}

#calcModal {
    background: transparent;

#calcBox{
    touch-action:none;
    will-change:transform;
}
    
}

#calcBox {
    position: fixed;
    bottom: 80px;
    right: 20px;
    z-index: 10000;
    pointer-events: auto;
}

.calculator-box{
    position: fixed;
    bottom: 80px;
    right: 20px;
    z-index: 99999;
}

.calculator-box{
    pointer-events: auto;
}

/* ===== MODERN GLASS CALCULATOR ===== */
.calculator-box{
    width: 280px;   /* smaller size */
    background: rgba(20,20,30,0.95);
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    padding: 15px;
    color: white;
    position: absolute;
    cursor: grab;
}    


/* HEADER */
#calcHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
    margin-bottom:10px;
    cursor: move;
}

/* DISPLAY */
#calcDisplay{
    width:100%;
    height:50px;
    font-size:22px;
    text-align:right;
    padding:10px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
    background:#111;
    color:#00ffcc;
}

/* BUTTON GRID */
.calculator-box button{
    width: 22%;
    margin:2%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:#2a2a3a;
    color:white;
    transition:0.2s;
}

.calculator-box button:hover{
    background:#00ffcc;
    color:black;
}

.calc-grid button{
    height:60px;

    border:none;

    border-radius:8px;

    font-size:18px;

    background:#e2e8f0;

    cursor:pointer;
}

.calc-grid button:hover{
    background:#cbd5e1;
}

/* SPECIAL BUTTONS */
.clear-btn{
    background:#ef4444;
    color:white;
}

.del-btn{
    background:#f97316;
    color:white;
}

/* ================= ATTENDANCE SYSTEM ================= */

.attendance-modal,
.delete-modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    justify-content:center;
    align-items:center;
    background:transparent;
    z-index:99999;
}

/* BOX */
.attendance-box,
.delete-box{
    width:350px;
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

/* HEADER */
.attendance-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
    margin-bottom:10px;
}

/* INPUTS */
.attendance-box input{
    width:100%;
    margin:5px 0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

/* BUTTONS */
.save-btn{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    margin-top:10px;
    border-radius:8px;
}

.danger-btn{
    background:red;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
}

/* LOGOUT MODAL */
.logout-modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:99999;
    animation:fadeIn .2s ease;
}

.logout-box{
    background:#111827;
    color:white;
    padding:25px;
    border-radius:12px;
    width:320px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.logout-actions{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.cancel-btn{
    background:#6b7280;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.confirm-btn{
    background:#ef4444;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">

    <div class="toggle-btn" onclick="toggleSidebar()">☰</div>

    <div class="sidebar-header">⛪ Portal</div>

    <a href="/dashboard"><span class="icon">🏠</span><span class="text">Dashboard</span></a>
    <a href="/finance"><span class="icon">💰</span><span class="text">Finance</span></a>
    <a href="/attendance"><span class="icon">📋</span><span class="text">Attendance</span></a>

    <!-- CALCULATOR BUTTON -->
    <a href="javascript:void(0)" onclick="openCalc()">
        <span class="icon">🧮</span>
        <span class="text">Calculator</span>
    </a>

     <a href="/remittance" data-title="Remittance">
         <span class="icon">📄</span>
         <span class="text">Remittance</span>
    </a>

    <a href="/pdf"><span class="icon">📄</span><span class="text">PDF</span></a>

    <a href="/change-password"><span class="icon">🔐</span><span class="text">Change Password</span></a>

    <a href="javascript:void(0)" onclick="openLogoutModal()">
        <span class="icon">🚪</span>
        <span class="text">Logout</span>
    </a>

    <div class="dark-toggle" onclick="toggleDarkMode()">🌙</div>

	</div>

<!-- ================= MAIN ================= -->
<div class="main">
    {% block content %}{% endblock %}
</div>

<!-- ================= CALCULATOR ================= -->
<div id="calcModal" style="display:none;">

    <div id="calcBox" style="
        width:280px;
        background:white;
        border-radius:10px;
        padding:12px;
        box-shadow:0 0 15px rgba(0,0,0,.25);
        position:absolute;
        top:120px;
        left:120px;
    ">

        <div id="calcHeader" style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            cursor:move;
            padding:6px;
            font-weight:bold;
            background:#f3f4f6;
            border-radius:8px;
        ">
            <span>🧮 Calculator</span>
            <button onclick="closeCalc()">✖</button>
        </div>

        <input id="calcDisplay" readonly style="
            width:100%;
            height:65px;
            font-size:22px;
            text-align:right;
            margin:10px 0;
            padding:6px;
            box-sizing:border-box;
        ">

        <div style="
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:6px;
        ">

            <button onclick="clearCalc()">C</button>
            <button onclick="delOne()">⌫</button>
            <button onclick="add('%')">%</button>
            <button onclick="add('/')">÷</button>

            <button onclick="add('7')">7</button>
            <button onclick="add('8')">8</button>
            <button onclick="add('9')">9</button>
            <button onclick="add('*')">×</button>

            <button onclick="add('4')">4</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('6')">6</button>
            <button onclick="add('-')">−</button>

            <button onclick="add('1')">1</button>
            <button onclick="add('2')">2</button>
            <button onclick="add('3')">3</button>
            <button onclick="add('+')">+</button>

            <button onclick="add('0')">0</button>
            <button onclick="add('.')">.</button>
            <button onclick="calculate()">=</button>
        </div>

    </div>

</div>

<!-- LOGOUT MODAL -->
<div id="logoutModal" class="logout-modal">

    <div class="logout-box">

        <h3>⚠️ Confirm Logout</h3>

        <p>Are you sure you want to logout?</p>

        <div class="logout-actions">

            <button class="cancel-btn" onclick="closeLogoutModal()">Cancel</button>

            <a href="/logout" class="confirm-btn">Yes, Logout</a>

        </div>

    </div>

</div>

<!-- ================= SCRIPT ================= -->
<script>

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("collapsed");
}

function toggleDarkMode(){
    document.body.classList.toggle("light");
}

function openCalc(){
    document.getElementById("calcModal").style.display = "block";
}

function closeCalc(){
    document.getElementById("calcModal").style.display = "none";
}

function add(v){
    document.getElementById("calcDisplay").value += v;
}

function clearCalc(){
    document.getElementById("calcDisplay").value = "";
}

function delOne(){
    let d = document.getElementById("calcDisplay");

    d.value = d.value.slice(0,-1);
}

function calculate(){

    try{
        document.getElementById("calcDisplay").value =
        eval(document.getElementById("calcDisplay").value);
    }

    catch{
        document.getElementById("calcDisplay").value = "Error";
    }
}

// ===== SMOOTH CALCULATOR DRAG =====

const calcBox = document.getElementById("calcBox");
const calcHeader = document.getElementById("calcHeader");

let dragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;


function dragStart(e){

    dragging = true;

    const point = e.touches ? e.touches[0] : e;

    startX = point.clientX - currentX;
    startY = point.clientY - currentY;

    calcBox.style.transition = "none";
}


function dragMove(e){

    if(!dragging) return;

    const point = e.touches ? e.touches[0] : e;


    currentX = point.clientX - startX;
    currentY = point.clientY - startY;


    calcBox.style.transform =
    `translate(${currentX}px, ${currentY}px)`;
}


function dragEnd(){

    dragging = false;

    calcBox.style.transition =
    "0.15s ease";
}



calcHeader.addEventListener(
"mousedown",
dragStart
);


document.addEventListener(
"mousemove",
dragMove
);


document.addEventListener(
"mouseup",
dragEnd
);


// Mobile

calcHeader.addEventListener(
"touchstart",
dragStart
);


document.addEventListener(
"touchmove",
dragMove
);


document.addEventListener(
"touchend",
dragEnd
);

</script>
</body>
</html>
