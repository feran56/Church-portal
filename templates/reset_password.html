<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <style>

    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg, #0f172a, #111827);
        font-family:Arial;
        color:white;
    }

    .box{
        width:380px;
        padding:30px;
        background:#111827;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.5);
        text-align:center;
        animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
        from{opacity:0; transform:translateY(20px);}
        to{opacity:1; transform:translateY(0);}
    }

    h2{
        margin-bottom:10px;
        color:#f97316;
    }

    p{
        font-size:14px;
        color:#cbd5e1;
        margin-bottom:20px;
    }

    input{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:none;
        border-radius:8px;
        outline:none;
        background:#1f2937;
        color:white;
        box-sizing:border-box;
    }

    input:focus{
        border:1px solid #f97316;
    }

    button{
        width:100%;
        padding:12px;
        background:#f97316;
        border:none;
        border-radius:8px;
        color:white;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }

    button:hover{
        background:#ea580c;
        transform:scale(1.03);
    }

    .msg{
        margin-top:15px;
        font-size:14px;
        color:#38bdf8;
    }

    .back{
        margin-top:15px;
        font-size:13px;
    }

    .back a{
        color:#f97316;
        text-decoration:none;
    }

    .back a:hover{
        text-decoration:underline;
    }

    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Reset Password</h2>

    <p>Enter your new password below</p>

    <form method="POST">

        <input type="password" name="new_password" placeholder="New Password" required>

        <button type="submit">Reset Password</button>

    </form>

    {% if message %}
        <div class="msg">{{ message }}</div>
    {% endif %}

    <div class="back">
        <a href="/">← Back to Login</a>
    </div>

</div>

</body>
</html>
