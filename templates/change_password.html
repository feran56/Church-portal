<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            font-family:Arial;
        }

        .box{
            width:370px;
            padding:30px;
            background:#111827;
            border-radius:14px;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
            animation:fadeIn .4s ease;
            color:white;
            text-align:center;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(15px);}
            to{opacity:1; transform:translateY(0);}
        }

        h2{
            margin-bottom:10px;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            border:none;
            color:white;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .msg{
            margin-top:10px;
            font-size:13px;
            color:#f87171;
        }

        .back{
            margin-top:10px;
            font-size:12px;
        }

        .back a{
            color:#93c5fd;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Change Password</h2>

    <form method="POST">

        <input type="password" name="old_password" placeholder="Old Password" required>

        <input type="password" name="new_password" placeholder="New Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Update Password</button>

    </form>

    {% if message %}
    <div class="msg">{{ message }}</div>
    {% endif %}

    <div class="back">
        <a href="/dashboard">← Back to Dashboard</a>
    </div>

</div>

</body>
</html>
