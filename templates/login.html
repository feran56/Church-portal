<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Church Portal Login</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            font-family:Arial;
            color:white;
        }

        .login-box{
            width:340px;
            padding:30px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
            animation:fadeIn 0.6s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            background:#3b82f6;
            border:none;
            border-radius:8px;
            color:white;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2563eb;
            transform:scale(1.03);
        }

        .error{
            color:#ff4d4d;
            text-align:center;
            margin-top:10px;
            font-size:14px;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h2>🔐 Church Portal Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

<a href="/forgot-password" style="color:white;">
    Forgot Password?
</a>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</div>

</body>
</html>
