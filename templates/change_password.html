<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>

    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#0f172a;
        font-family:Arial;
        color:white;
    }

    .box{
        width:350px;
        padding:25px;
        background:#111827;
        border-radius:12px;
        box-shadow:0 10px 25px rgba(0,0,0,0.5);
        animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
        from{opacity:0; transform:translateY(20px);}
        to{opacity:1; transform:translateY(0);}
    }

    input{
        width:100%;
        padding:12px;
        margin:8px 0;
        border:none;
        border-radius:8px;
        outline:none;
    }

    button{
        width:100%;
        padding:12px;
        background:#22c55e;
        border:none;
        border-radius:8px;
        color:white;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#16a34a;
        transform:scale(1.03);
    }

    .msg{
        text-align:center;
        margin-top:10px;
        font-size:14px;
        color:#38bdf8;
    }

    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Change Password</h2>

    <form method="POST">

        <input type="password" name="old_password" placeholder="Old Password" required>

        <input type="password" name="new_password" placeholder="New Password" required>

        <button type="submit">Update Password</button>

    </form>

    {% if message %}
        <div class="msg">{{ message }}</div>
    {% endif %}

</div>

</body>
</html>
