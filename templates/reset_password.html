<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .toggle {
            text-align: left;
            font-size: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background: #218838;
        }

        .message {
            margin-top: 10px;
            font-size: 14px;
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Reset Password</h2>

    <form method="POST" onsubmit="return validatePassword()">
        
        <input type="password" id="password" name="password" placeholder="New password" required>
        
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>

        <div class="toggle" onclick="togglePassword()">
            👁 Show / Hide Password
        </div>

        <button type="submit">Update Password</button>
    </form>

    {% if message %}
        <p class="message {% if 'success' in message or 'successfully' in message %}success{% endif %}">
            {{ message }}
        </p>
    {% endif %}
</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    let confirm = document.getElementById("confirm_password");

    if (pass.type === "password") {
        pass.type = "text";
        confirm.type = "text";
    } else {
        pass.type = "password";
        confirm.type = "password";
    }
}

function validatePassword() {
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirm_password").value;

    if (pass !== confirm) {
        alert("❌ Passwords do not match!");
        return false;
    }

    return true;
}
</script>

</body>
</html>
